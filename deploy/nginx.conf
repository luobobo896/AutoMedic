# ============================================================
# AutoMedic Nginx 反向代理配置
# 关键点：必须放行 WebSocket 升级（任务实时终端）
# ============================================================
upstream automedic {
    server 127.0.0.1:8080;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name automedic.example.com;
    client_max_body_size 10m;

    # ---- 安全响应头 ----
    # 以下头对所有响应生效（proxy 不覆盖则继承 server 级 add_header）。
    add_header X-Frame-Options        "DENY"                 always;
    add_header X-Content-Type-Options "nosniff"              always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection        "1; mode=block"       always;
    # 精简 CSP：仅允许同源资源与 WebSocket；如需第三方 CDN/字体请按需放宽
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ---- HTTPS / HSTS（默认注释，避免自签证书直接套用导致站点不可用）----
    # 生产请用可信证书（如 certbot）并取消下方注释：
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/automedic.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/automedic.example.com/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    # 启用 HSTS（仅 HTTPS 生效，max-age=31536000 一年，includeSubDomains + preload 按需开启）：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 任务实时终端（WebSocket）
    location /ws/ {
        proxy_pass http://automedic;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;   # dsh 修复最长 30 分钟，需放宽
        proxy_send_timeout 3600s;
    }

    # API
    location /api/ {
        proxy_pass http://automedic;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 静态前端
    location / {
        proxy_pass http://automedic;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
