# ============================================================
# AutoMedic — 事件驱动的 dsh 全自动/半自动 Bug 修复平台
# 快速启动：docker compose up -d
# 访问：http://localhost:8080
# ============================================================

services:
  automedic:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DSH_VERSION: latest
    image: automedic/automedic:latest
    container_name: automedic
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # --- 必填（生产环境） ---
      AUTOMEDIC_SERVER_ADMIN_TOKEN: ${AUTOMEDIC_ADMIN_TOKEN:-change-me}
      # 留空时容器首次启动会在数据卷生成并复用随机密钥（/app/data/.secret_key）
      AUTOMEDIC_SECURITY_SECRET_KEY: ${AUTOMEDIC_SECRET_KEY:-}
      # --- 可选覆盖 ---
      AUTOMEDIC_SERVER_MODE: release
      AUTOMEDIC_DB_DRIVER: ${AUTOMEDIC_DB_DRIVER:-sqlite}
      AUTOMEDIC_DB_DSN: ${AUTOMEDIC_DB_DSN:-/app/data/automedic.db}
      AUTOMEDIC_DSH_BIN: /usr/local/bin/dsh
      TZ: Asia/Shanghai
    volumes:
      - automedic-data:/app/data
      # 如需复用宿主机上已安装并登录过的 dsh，可挂载其配置目录
      # - ~/.dsh:/root/.dsh:ro
      # 如需使用宿主机 SSH 私钥（只读）
      # - ~/.ssh:/root/.ssh:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # depends_on:
    #   mysql:
    #     condition: service_healthy

  # ----------------------------------------------------------
  # 可选：MySQL 8（默认用 SQLite，小规模可直接跑）
