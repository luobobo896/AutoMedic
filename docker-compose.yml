# ============================================================
# AutoMedic — 事件驱动的 dsh 全自动/半自动 Bug 修复平台
# 快速启动：docker compose up -d
# 访问：http://localhost:8080
# ============================================================

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: automedic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: automedic
      POSTGRES_PASSWORD: ${AUTOMEDIC_DB_PASSWORD:-automedic}
      POSTGRES_DB: automedic
      TZ: Asia/Shanghai
    volumes:
      - automedic-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automedic -d automedic"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  automedic:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DSH_VERSION: latest
    image: automedic/automedic:latest
    container_name: automedic
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AUTOMEDIC_SERVER_ADMIN_TOKEN: ${AUTOMEDIC_ADMIN_TOKEN:-change-me}
      AUTOMEDIC_SECURITY_SECRET_KEY: ${AUTOMEDIC_SECRET_KEY:-}
      AUTOMEDIC_SERVER_MODE: release
      AUTOMEDIC_DB_DRIVER: postgres
      AUTOMEDIC_DB_DSN: host=postgres user=automedic password=${AUTOMEDIC_DB_PASSWORD:-automedic} dbname=automedic port=5432 sslmode=disable TimeZone=Asia/Shanghai
      AUTOMEDIC_DSH_BIN: /usr/local/bin/dsh
      TZ: Asia/Shanghai
    volumes:
      - automedic-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  automedic-data:
  automedic-pg:
