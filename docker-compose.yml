  #   1) 取消下面 mysql 服务与 depends_on 的注释
  #   2) 设置 AUTOMEDIC_DB_DRIVER=mysql
  #   3) AUTOMEDIC_DB_DSN=automedic:automedic@tcp(mysql:3306)/automedic?charset=utf8mb4&parseTime=True&loc=Local
  #   4) 首次启动前手动执行 server/migrations/001_init.mysql.sql
