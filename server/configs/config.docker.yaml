# 容器部署配置（由 Dockerfile 复制为 /app/configs/config.yaml）
# AutoMedic 容器部署配置
# 所有字段均可用 AUTOMEDIC_ 前缀环境变量覆盖，优先级：环境变量 > 配置文件 > 默认值
# 例：AUTOMEDIC_DB_DRIVER=mysql  =>  db.driver=mysql

server:
  addr: ":8080"               # AUTOMEDIC_SERVER_ADDR
  mode: "release"             # debug | release（生产务必 release）
  web_dir: "/app/web/dist"    # 前端构建产物目录，留空则不托管静态资源
  admin_token: ""             # 管理 API 令牌；强烈建议用 AUTOMEDIC_SERVER_ADMIN_TOKEN 注入
  read_timeout: 60            # 秒
  write_timeout: 300

db:
  driver: "sqlite"            # sqlite | mysql（AUTOMEDIC_DB_DRIVER）
  dsn: "/app/data/automedic.db"
  # MySQL 示例：
  # driver: "mysql"
  # dsn: "automedic:StrongPass@tcp(mysql:3306)/automedic?charset=utf8mb4&parseTime=True&loc=Local"
  max_open: 50
  max_idle: 10
  log_level: "warn"           # silent | error | warn | info

security:
  # 敏感字段加密主密钥（>=32 字节）。生产环境务必通过
  # AUTOMEDIC_SECURITY_SECRET_KEY 注入，禁止使用默认值。
  secret_key: ""

dsh:
  bin: "/usr/local/bin/dsh"   # DeepSeek Harness 可执行文件
  home: ""                    # 留空则使用 dsh 默认 HOME
  # headless profile 只接受一个 task 文本参数，
  # 模型与上下文通过 --patch 注入（见 patch_template）
  command_template: '{{.Bin}} --profile headless {{.Patches}} "$(cat {{.TaskFile}})"'
  use_shell: true
  timeout_sec: 1800
  permission_mode: "workspace-write"   # dsh 仅可在隔离工作区写文件
  instruction_file: "AUTOMEDIC.md"
  output_format: "text"
  env:
    - "DSH_TELEMETRY_MODE=DISABLED"
    - "PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

ocr:
  bin: "ocr"
  timeout_sec: 600
  env: []

git:
  workspace_root: "/app/data/workspaces"
  depth: 1
  reuse_workspace: true
  branch_prefix: "automedic/fix-"
  author_name: "AutoMedic"
  author_email: "automedic@local"
  auto_push: true             # 全自动模式下自动推送修复分支
  release_hook: ""            # 推送成功后执行的钩子，如 "curl -fsS https://ci.example.com/hook"
  bin: "git"
  keep_days: 7                # 工作区保留天数

log:
  level: "info"
  dir: "/app/data/logs"
  retain: 14
  format: "text"              # text | json
